name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # La solución completa solo compila en Windows: WPF, COM y P/Invoke.
  build:
    name: Compilar y probar (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar
        run: dotnet restore AvDashboard.sln

      - name: Compilar
        run: dotnet build AvDashboard.sln --configuration Release --no-restore

      - name: Probar
        run: >
          dotnet test tests/AvDashboard.Core.Tests/AvDashboard.Core.Tests.csproj
          --configuration Release --no-build --logger "trx;LogFileName=core-tests.trx"

      - name: Probar el cliente
        run: >
          dotnet test tests/AvDashboard.Client.Tests/AvDashboard.Client.Tests.csproj
          --configuration Release --no-build --logger "trx;LogFileName=client-tests.trx"

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  # Core no depende de Windows a propósito: es la capa donde vive la lógica que se puede
  # probar en cualquier sitio, y este job existe para que siga siendo verdad.
  core-portable:
    name: Core multiplataforma (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compilar Core
        run: dotnet build src/AvDashboard.Core/AvDashboard.Core.csproj --configuration Release

      # La capa de cliente tampoco depende de Windows: la comparten la interfaz de WPF y la
      # de WinUI 3, y compilarla aqui es lo que garantiza que siga sin atarse a ninguna.
      - name: Compilar el cliente
        run: dotnet build src/AvDashboard.Client/AvDashboard.Client.csproj --configuration Release

      - name: Probar Core
        run: dotnet test tests/AvDashboard.Core.Tests/AvDashboard.Core.Tests.csproj --configuration Release

      # Y probarlo, no solo compilarlo. Client tenia cuatro mil lineas sin una sola prueba
      # mientras aqui se decia que este job era «donde se prueba de verdad»: la logica de las
      # filas de formato y del panel se rompio una vez y lo pillo una captura de pantalla.
      #
      # Correrlo en Linux ademas prueba algo que en Windows no se ve: que Client no se ha
      # atado a Windows por accidente.
      - name: Probar el cliente
        run: dotnet test tests/AvDashboard.Client.Tests/AvDashboard.Client.Tests.csproj --configuration Release

      # El mapa del proyecto se genera desde el codigo. Si alguien commitea sin
      # regenerarlo, el diagrama empieza a mentir, y un diagrama que miente es peor que no
      # tenerlo. Esto lo impide.
      - name: Comprobar que docs/grafo.md esta al dia
        run: dotnet run --project tools/AvDashboard.Graph --configuration Release -- . --check
